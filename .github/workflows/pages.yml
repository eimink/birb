name: Deploy editor to GitHub Pages

# Publish the minified tracker/editor to Pages whenever a version tag is
# pushed or a GitHub Release is published. Also runnable by hand.
on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer run supersedes an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install terser (minify_editor.py shells out to it)
        run: npm install -g terser

      - name: Build minified editor
        run: |
          python3 minify_editor.py web/editor.html web/editor.min.html
          mkdir -p _site
          cp web/editor.min.html _site/index.html

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
